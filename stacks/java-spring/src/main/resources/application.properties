spring.application.name=java-spring
spring.main.banner-mode=off
server.port=8080

# Spring MVC on virtual threads: blocking JDBC and HTTP calls without a bounded request thread pool.
spring.threads.virtual.enabled=true
# Tomcat closes a keep-alive connection after 100 requests by default; keep connections open
# like every other stack's server does (docs/03, "HTTP keep-alive: On").
server.tomcat.max-keep-alive-requests=-1

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:bench}
spring.datasource.username=${DB_USER:bench}
spring.datasource.password=${DB_PASSWORD:bench}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:64}
# Keep retrying the first connection for up to a minute while the DB starts.
spring.datasource.hikari.initialization-fail-timeout=60000

spring.jpa.hibernate.ddl-auto=none
# The production setting Spring Boot's startup warning asks for: no session held open across the view.
spring.jpa.open-in-view=false

spring.jackson.property-naming-strategy=SNAKE_CASE
# Strict input types: "42" is not an integer and 1.5 is not 1 (test 5 validation).
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false

logging.level.root=warn
