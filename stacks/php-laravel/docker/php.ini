; Loaded after php.ini-production (copied to php.ini in the Dockerfile).
; Everything not listed here keeps the production defaults.

; OPcache on, no file stat per request, tracing JIT (docs/03).
; jit_buffer_size keeps its default (64M since PHP 8.4), memory_consumption its default 128M.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.jit = tracing

; Test 8 dataset only (docs/02 Appendix A).
opcache.preload = /var/www/html/docker/preload.php
opcache.preload_user = www-data
