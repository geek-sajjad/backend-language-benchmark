# Replaces Debian's /etc/nginx/nginx.conf. The server block is the one from
# Laravel's deployment docs (https://laravel.com/docs/13.x/deployment#nginx).
user www-data;
worker_processes auto;
worker_rlimit_nofile 1048576;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    # Debian's default is 768; k6 holds thousands of keep-alive connections.
    worker_connections 65535;
}

http {
    access_log off;
    server_tokens off;
    default_type application/octet-stream;

    # Nginx closes a keep-alive connection after 1000 requests by default;
    # effectively unlimited here, like the other stacks' servers (docs/03).
    keepalive_requests 1000000000;

    server {
        listen 8080 default_server;
        root /var/www/html/public;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ ^/index\.php(/|$) {
            fastcgi_pass unix:/run/php/fpm.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
