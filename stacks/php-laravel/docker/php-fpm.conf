; Pool overrides. Named zzz-* so it loads after the image's docker.conf and zz-docker.conf.
[www]
; Unix socket to Nginx, as in Laravel's deployment docs.
listen = /run/php/fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 64 children, fixed and not tuned (docs/03): each child holds at most one
; Postgres connection, so this matches the 64-connection rule.
pm = static
pm.max_children = 64
