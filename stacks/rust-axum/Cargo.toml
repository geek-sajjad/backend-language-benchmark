[package]
name = "bench-rust-axum"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
validator = { version = "0.21.0", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
