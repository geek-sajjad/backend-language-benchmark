apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy            # viewers never talk to Prometheus directly; it is not public
    url: http://127.0.0.1:9090
    orgId: 1                 # renamed to "Benchmark" by grafana-init
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 1s       # = scrape interval, so $__rate_interval is as tight as possible
      httpMethod: POST
