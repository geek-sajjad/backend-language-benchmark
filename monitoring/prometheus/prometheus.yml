# Prometheus on the loadgen host. Scrapes every 1 s; k6 pushes into it via remote write
# (--web.enable-remote-write-receiver). Native histograms (k6 trends) are stable in
# Prometheus 3.x and need no feature flag.
#
# Targets come from file_sd files in targets/. The committed files point at 127.0.0.1
# (local dev, all three "hosts" are this machine); on AWS, gen-targets.sh rewrites them
# with private IPs. Prometheus re-reads them without a restart.
#
# Every target carries a `host` label: app | db | loadgen. The runner relies on the job
# names (node, cadvisor, postgres) and on that label.
global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 1s

storage:
  tsdb:
    retention:
      time: 15d

scrape_configs:
  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/targets/node.json]
        refresh_interval: 10s

  - job_name: cadvisor
    file_sd_configs:
      - files: [/etc/prometheus/targets/cadvisor.json]
        refresh_interval: 10s
    metric_relabel_configs:
      # Keep only the series the dashboards and runner use; cAdvisor's per-container
      # output is large and we scrape it every second.
      - source_labels: [__name__]
        regex: "container_(cpu_usage_seconds_total|cpu_user_seconds_total|cpu_system_seconds_total|cpu_cfs_throttled_seconds_total|memory_rss|memory_usage_bytes|memory_working_set_bytes|memory_cache|memory_mapped_file|memory_swap|memory_max_usage_bytes|memory_failcnt|oom_events_total|threads|threads_max|processes|sockets|file_descriptors|network_receive_bytes_total|network_transmit_bytes_total|network_receive_packets_total|network_transmit_packets_total|network_receive_packets_dropped_total|network_transmit_packets_dropped_total|spec_memory_limit_bytes|start_time_seconds|last_seen|pressure_.*)|machine_.*|cadvisor_version_info"
        action: keep

  - job_name: postgres
    file_sd_configs:
      - files: [/etc/prometheus/targets/postgres.json]
        refresh_interval: 10s
