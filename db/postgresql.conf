# Postgres 18 config for the db host (c7a.xlarge: 4 vCPU / 8 GiB). Same for every stack.
# Memory sizes for a laptop are overridden on the command line in compose.yml.

listen_addresses = '*'
port = 5432
max_connections = 200                 # PHP-FPM connects per request, bounded by max_children (docs/03-tech-stacks.md)
password_encryption = scram-sha-256

shared_buffers = 2GB                  # the ~0.5 GB dataset fits entirely
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB

wal_level = replica
max_wal_size = 8GB
checkpoint_timeout = 15min
synchronous_commit = on               # durable commits; group commit batches the fsyncs

max_worker_processes = 8
max_parallel_workers_per_gather = 0   # OLTP queries; keeps per-request cost predictable

shared_preload_libraries = 'pg_stat_statements,pg_prewarm'
pg_stat_statements.track = top

log_min_duration_statement = -1
log_statement = 'none'
