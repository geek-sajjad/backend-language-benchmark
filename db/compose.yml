# Postgres 18 with the deterministic seed. First start seeds bench_template (a few minutes),
# then creates bench from it. Data persists in the bench-pgdata volume.
#   docker compose -f db/compose.yml up -d
#   docker compose -f db/compose.yml down -v    # wipe and reseed next time
name: bench-db
services:
  postgres:
    image: postgres:18.6
    container_name: bench-db
    network_mode: host
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench_template
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-4GB}
    volumes:
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./init:/docker-entrypoint-initdb.d:ro
      - bench-pgdata:/var/lib/postgresql
    shm_size: 2g
    restart: unless-stopped
    ulimits:
      nofile: 1048576
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bench", "-d", "bench"]
      interval: 5s
      timeout: 3s
      retries: 120
volumes:
  bench-pgdata:
